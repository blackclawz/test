name: PR Review Notification

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Send Telegram notification
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, urllib.parse

          msg = (
            "\U0001f514 *PR Review Required*\n"
            f"*Repo:* `{os.environ['REPO']}`\n"
            f"*PR #{os.environ['PR_NUMBER']}:* {os.environ['PR_TITLE']}\n"
            f"*Author:* @{os.environ['AUTHOR']}\n"
            f"*Branch:* `{os.environ['BRANCH']}`\n\n"
            f"\U0001f449 [Review & Approve]({os.environ['PR_URL']})"
          )

          data = urllib.parse.urlencode({
            "chat_id": os.environ["CHAT_ID"],
            "text": msg,
            "parse_mode": "Markdown",
            "disable_web_page_preview": "true"
          }).encode()

          req = urllib.request.Request(
            f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
            data=data
          )
          with urllib.request.urlopen(req) as r:
            print(r.status, r.read().decode())
          PYEOF
